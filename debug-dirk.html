<!DOCTYPE html>
<html>
<head>
    <title>Debug Dirk's Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .data { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Debug All Recruiters' Database Data</h1>
    <button onclick="checkAllRecruiters()">Check All Recruiters</button>
    <div id="results"></div>

    <script>
        async function checkAllRecruiters() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                // Get all recruiters
                const response = await fetch('/api/recruiters.json');
                const data = await response.json();
                
                let html = '<h2>All Recruiters Database Data:</h2>';
                
                if (data.success && data.data) {
                    const recruiters = data.data;
                    
                    recruiters.forEach(recruiter => {
                        const emailMatch = recruiter.email === recruiter.login_email;
                        html += `
                            <div class="data">
                                <h3>${recruiter.name} (ID: ${recruiter.id})</h3>
                                <p><strong>Email:</strong> ${recruiter.email}</p>
                                <p><strong>Login Email:</strong> ${recruiter.login_email}</p>
                                <p><strong>Slug:</strong> ${recruiter.slug}</p>
                                <p><strong>Agency:</strong> ${recruiter.agency}</p>
                                <p><strong>Is Active:</strong> ${recruiter.is_active}</p>
                                <p><strong>Email Match:</strong> ${emailMatch ? '✅ Match' : '❌ MISMATCH'}</p>
                                ${!emailMatch ? `<p style="color: red;"><strong>⚠️ ISSUE:</strong> Login email should be ${recruiter.email}</p>` : ''}
                            </div>
                        `;
                    });
                    
                    // Summary
                    const mismatches = recruiters.filter(r => r.email !== r.login_email);
                    html += `
                        <div class="data" style="background: ${mismatches.length > 0 ? '#ffe6e6' : '#e6ffe6'};">
                            <h3>Summary</h3>
                            <p><strong>Total Recruiters:</strong> ${recruiters.length}</p>
                            <p><strong>Email Mismatches:</strong> ${mismatches.length}</p>
                            ${mismatches.length > 0 ? `<p><strong>Affected:</strong> ${mismatches.map(r => r.name).join(', ')}</p>` : ''}
                        </div>
                    `;
                } else {
                    html += `<p>❌ Error: ${data.error || 'No data found'}</p>`;
                }
                
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
